name: Release client exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install "pyinstaller>=6.11,<7"

      - name: Build client
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') {
            $version = $tag -replace '^v',''
          } else {
            $version = python -c "import sys; sys.path.insert(0,'client/src'); from services import __version__; print(__version__)"
          }
          python tools/generate_version_info.py $version
          pyinstaller --noconfirm --clean asobby.spec

      - name: Sign client executable (optional)
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
        run: |
          pwsh -File tools/sign_windows_release.ps1 -Path dist/asobby/asobby.exe

      - name: Prepare release asset
        shell: pwsh
        run: |
          if (-not (Test-Path dist/asobby/asobby.exe)) {
            Write-Error "dist/asobby/asobby.exe not found"
            exit 1
          }
          Compress-Archive -Path dist/asobby -DestinationPath asobby-win64.zip -Force
          echo "ASSET_NAME=asobby-win64.zip" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            $tag = "v" + (python -c "import sys; sys.path.insert(0,'client/src'); from services import __version__; print(__version__)")
          }
          $asset = $env:ASSET_NAME

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset `
              --title "asobby client $tag" `
              --generate-notes
          } else {
            gh release upload $tag $asset --clobber
          }
