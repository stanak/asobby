name: Release client exe

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r client/requirements.txt
          pip install pyinstaller

      - name: Build client
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          python tools/generate_version_info.py $version
          pyinstaller --noconfirm --clean asobby.spec

      - name: Prepare release asset
        run: |
          $tag = "${{ github.ref_name }}"
          $exeName = "asobby-$tag-windows.exe"
          Copy-Item "dist/asobby.exe" $exeName
          echo "ASSET_NAME=$exeName" >> $env:GITHUB_ENV

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = $env:ASSET_NAME

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset `
              --title "asobby client $tag" `
              --generate-notes
          } else {
            gh release upload $tag $asset --clobber
          }
