<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asobby - 非想天則ロビー</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2129;
    --border: #2c3440;
    --text: #d8dee9;
    --muted: #7b8794;
    --accent: #6ab0f3;
    --battle: #5a6470;
    --ok: #57c07d;
    --err: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 20px 8px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 1px;
  }
  header .sub { color: var(--muted); font-size: 13px; }
  #status {
    font-size: 13px;
    color: var(--muted);
  }
  #auth-info {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  #auth-info a {
    color: var(--accent);
    text-decoration: none;
  }
  #auth-info a:hover { text-decoration: underline; }
  #status.connected::before { content: "●"; color: var(--ok); margin-right: 6px; }
  #status.disconnected::before { content: "●"; color: var(--err); margin-right: 6px; }
  .section-title {
    padding: 12px 20px 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .count { color: var(--muted); font-size: 13px; padding: 0 20px 6px; }
  main { padding: 0 20px 32px; }
  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  th, td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  td.comment { white-space: normal; word-break: break-word; }
  th {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: rgba(255,255,255,0.02);
  }
  tr:last-child td { border-bottom: none; }
  tr.battle td { color: var(--battle); }
  .badge {
    display: inline-block;
    font-size: 11px;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    margin-right: 4px;
    color: var(--muted);
  }
  a.stream { color: var(--accent); text-decoration: none; }
  a.stream:hover { text-decoration: underline; }
  button.copy {
    background: transparent;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  button.copy:hover { border-color: var(--accent); }
  button.copy.copied { color: var(--ok); border-color: var(--ok); }
  .empty {
    padding: 24px 0;
    text-align: center;
    color: var(--muted);
  }
  .gate {
    padding: 24px 20px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .gate a { color: var(--accent); text-decoration: none; }
  .gate a:hover { text-decoration: underline; }
  .avatar {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    vertical-align: -6px;
    margin-right: 6px;
  }
</style>
</head>
<body>
<header>
  <h1>asobby</h1>
  <span class="sub">非想天則 対戦募集ロビー</span>
  <span id="auth-info" hidden></span>
  <span id="status" class="disconnected" hidden>接続中...</span>
</header>

<div class="section-title">ランクマ募集</div>
<div id="ranked-gate" class="gate" hidden>
  ランクマ募集を見るには <a href="/auth/discord/web">Discord ログイン</a> が必要です
</div>
<div id="ranked-section" hidden>
  <div class="count" id="ranked-count"></div>
  <main>
    <table>
      <thead>
        <tr>
          <th>Match</th>
          <th>User</th>
          <th>Rank</th>
          <th>Cap</th>
          <th>Stream</th>
          <th>Comment</th>
          <th>Addr</th>
        </tr>
      </thead>
      <tbody id="ranked-rows"></tbody>
    </table>
    <div id="ranked-empty" class="empty" hidden>現在ランクマ募集はありません</div>
  </main>
</div>

<div class="section-title">カジュアル募集</div>
<div class="count" id="casual-count"></div>
<main>
  <table>
    <thead>
      <tr>
        <th>Match</th>
        <th>User</th>
        <th>Rank</th>
        <th>Cap</th>
        <th>Stream</th>
        <th>Comment</th>
        <th>Addr</th>
      </tr>
    </thead>
    <tbody id="casual-rows"></tbody>
  </table>
  <div id="casual-empty" class="empty" hidden>現在カジュアル募集はありません</div>
</main>

<script>
"use strict";

const NET_BATTLE = 4;
const RANK_LABEL = {
  easy: "E", normal: "N", ex: "Ex", hard: "H", luna: "L", ph: "Ph",
};

const posts = new Map();
let myRank = null;

const rankedRowsEl = document.getElementById("ranked-rows");
const casualRowsEl = document.getElementById("casual-rows");
const rankedEmptyEl = document.getElementById("ranked-empty");
const casualEmptyEl = document.getElementById("casual-empty");
const rankedCountEl = document.getElementById("ranked-count");
const casualCountEl = document.getElementById("casual-count");
const rankedGateEl = document.getElementById("ranked-gate");
const rankedSectionEl = document.getElementById("ranked-section");
const statusEl = document.getElementById("status");
const authInfoEl = document.getElementById("auth-info");

function rankLabel(p) {
  const key = (p.rank || "easy").toLowerCase();
  const label = RANK_LABEL[key] || p.rank || "";
  if (key === "ph" && p.rating != null) {
    return `${label} (${p.rating})`;
  }
  return label;
}

function sortPosts(list) {
  list.sort((a, b) => {
    const dc = (b.created_at || 0) - (a.created_at || 0);
    if (dc !== 0) return dc;
    return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
  });
  return list;
}

function buildRow(p) {
  const tr = document.createElement("tr");
  if (p.net_status === NET_BATTLE) tr.classList.add("battle");

  tr.appendChild(td(p.match_status || ""));

  const userCell = document.createElement("td");
  if (p.owner_avatar) {
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = p.owner_avatar;
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    img.alt = "";
    userCell.appendChild(img);
  }
  if (p.owner_name) {
    userCell.appendChild(document.createTextNode(p.owner_name));
  }
  if (p.guest_name) {
    if (p.owner_name) {
      userCell.appendChild(document.createTextNode(" vs "));
    } else {
      userCell.appendChild(document.createTextNode("vs "));
    }
    if (p.guest_avatar) {
      const gimg = document.createElement("img");
      gimg.className = "avatar";
      gimg.src = p.guest_avatar;
      gimg.loading = "lazy";
      gimg.referrerPolicy = "no-referrer";
      gimg.alt = "";
      userCell.appendChild(gimg);
    }
    userCell.appendChild(document.createTextNode(p.guest_name));
  }
  tr.appendChild(userCell);
  tr.appendChild(td(rankLabel(p)));

  const cap = document.createElement("td");
  if (p.autopunch) cap.appendChild(badge("A"));
  if (p.giuroll) cap.appendChild(badge("G"));
  tr.appendChild(cap);

  const stream = document.createElement("td");
  if ((p.stream_url || "").trim()) {
    const a = document.createElement("a");
    a.className = "stream";
    a.href = p.stream_url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.textContent = "▶ 配信";
    stream.appendChild(a);
  }
  tr.appendChild(stream);

  const comment = td(p.comment || "");
  comment.className = "comment";
  tr.appendChild(comment);

  const addr = document.createElement("td");
  const btn = document.createElement("button");
  btn.className = "copy";
  btn.textContent = p.addr;
  btn.title = "クリックでコピー";
  btn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(p.addr);
    } catch (_) {
      const ta = document.createElement("textarea");
      ta.value = p.addr;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    btn.classList.add("copied");
    const orig = btn.textContent;
    btn.textContent = "コピーしました";
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.textContent = orig;
    }, 1200);
  });
  addr.appendChild(btn);
  tr.appendChild(addr);

  return tr;
}

function fillTable(tbody, list) {
  tbody.textContent = "";
  for (const p of list) {
    tbody.appendChild(buildRow(p));
  }
}

function render() {
  const all = [...posts.values()];
  let ranked = all.filter((p) => (p.post_type || "casual") === "ranked");
  const casual = all.filter((p) => (p.post_type || "casual") !== "ranked");

  if (myRank) {
    ranked = ranked.filter((p) => (p.rank || "easy").toLowerCase() === myRank);
    rankedGateEl.hidden = true;
    rankedSectionEl.hidden = false;
  } else {
    rankedGateEl.hidden = false;
    rankedSectionEl.hidden = true;
    ranked = [];
  }

  sortPosts(ranked);
  sortPosts(casual);

  fillTable(rankedRowsEl, ranked);
  fillTable(casualRowsEl, casual);

  rankedEmptyEl.hidden = ranked.length > 0 || !myRank;
  casualEmptyEl.hidden = casual.length > 0;
  rankedCountEl.textContent = `${ranked.length} 件`;
  casualCountEl.textContent = `${casual.length} 件`;
}

function td(text) {
  const el = document.createElement("td");
  el.textContent = text;
  return el;
}

function badge(text) {
  const el = document.createElement("span");
  el.className = "badge";
  el.textContent = text;
  return el;
}

function showLoggedIn(user) {
  myRank = (user.rank || "easy").toLowerCase();
  authInfoEl.hidden = false;
  authInfoEl.textContent = "";
  authInfoEl.appendChild(document.createTextNode(`${user.name} でログイン中 (${RANK_LABEL[myRank] || myRank})`));
  const sep = document.createElement("span");
  sep.textContent = " / ";
  authInfoEl.appendChild(sep);
  const stats = document.createElement("a");
  stats.href = "/stats";
  stats.textContent = "戦績";
  authInfoEl.appendChild(stats);
  const sep2 = document.createElement("span");
  sep2.textContent = " / ";
  authInfoEl.appendChild(sep2);
  const logout = document.createElement("a");
  logout.href = "/auth/logout";
  logout.textContent = "ログアウト";
  authInfoEl.appendChild(logout);
  statusEl.hidden = false;
  render();
}

function showLoginRequired() {
  myRank = null;
  authInfoEl.hidden = false;
  authInfoEl.textContent = "";
  const login = document.createElement("a");
  login.href = "/auth/discord/web";
  login.textContent = "Discord でログイン";
  authInfoEl.appendChild(login);
  statusEl.hidden = false;
  render();
}

async function initAuth() {
  connect();
  try {
    const res = await fetch("/auth/me");
    if (res.ok) {
      showLoggedIn(await res.json());
      return;
    }
  } catch (_) {}
  showLoginRequired();
}

function connect() {
  const es = new EventSource("/sse/posts");

  es.addEventListener("open", () => {
    statusEl.className = "connected";
    statusEl.textContent = "リアルタイム更新中";
  });

  es.addEventListener("snapshot", (e) => {
    posts.clear();
    for (const p of JSON.parse(e.data)) posts.set(p.id, p);
    render();
  });

  es.addEventListener("upsert", (e) => {
    const p = JSON.parse(e.data);
    posts.set(p.id, p);
    render();
  });

  es.addEventListener("close", (e) => {
    const d = JSON.parse(e.data);
    posts.delete(d.id);
    render();
  });

  es.addEventListener("error", () => {
    statusEl.className = "disconnected";
    statusEl.textContent = "再接続中...";
  });
}

initAuth();
</script>
</body>
</html>
