<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>asobby - 戦績</title>
<style>
  :root {
    --bg: #14171c;
    --panel: #1c2129;
    --border: #2c3440;
    --text: #d8dee9;
    --muted: #7b8794;
    --accent: #6ab0f3;
    --ok: #57c07d;
    --err: #e06c75;
    --wr-high: #6fcf97;
    --wr-low: #e07a7a;
    --row-hover: rgba(255,255,255,0.04);
    --row-selected: rgba(106,176,243,0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 15px;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 16px 20px 8px;
  }
  header h1 {
    margin: 0;
    font-size: 20px;
    letter-spacing: 1px;
  }
  header .sub { color: var(--muted); font-size: 13px; }
  header nav {
    margin-left: auto;
    font-size: 13px;
    display: flex;
    gap: 12px;
  }
  header nav a {
    color: var(--accent);
    text-decoration: none;
  }
  header nav a:hover { text-decoration: underline; }
  main { padding: 8px 20px 32px; max-width: 1280px; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    margin-bottom: 16px;
  }
  .panel h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
  }
  .user-name { font-size: 18px; font-weight: 600; }
  .summary { font-size: 16px; }
  .win-rate { color: var(--ok); font-weight: 600; }
  .filter-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .filter-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    background: rgba(106,176,243,0.12);
    border: 1px solid rgba(106,176,243,0.35);
    border-radius: 16px;
    font-size: 13px;
  }
  .filter-chip button {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 0 2px;
  }
  .filter-chip button:hover { color: var(--text); }
  .filter-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
  }
  .filter-actions label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .btn-clear {
    padding: 4px 12px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
  }
  .btn-clear:hover {
    color: var(--text);
    border-color: var(--muted);
  }
  .btn-more {
    margin-top: 8px;
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--accent);
    font-size: 13px;
    cursor: pointer;
  }
  .btn-more:hover { border-color: var(--accent); }
  .summary-row {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 8px 20px;
  }
  .summary-main { font-size: 16px; }
  .summary-recent {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 14px;
    color: var(--muted);
  }
  .summary-recent span strong {
    color: var(--text);
    font-weight: 600;
  }
  .facets {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  .facet {
    flex: 1 1 280px;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .facet h2 {
    margin: 0 0 10px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .facet-scroll {
    max-height: 420px;
    overflow-y: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th, td {
    text-align: left;
    padding: 7px 8px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  tr:last-child td { border-bottom: none; }
  tr.facet-row { cursor: pointer; }
  tr.facet-row:hover td { background: var(--row-hover); }
  tr.facet-row.selected td { background: var(--row-selected); }
  td.wr-high { color: var(--wr-high); font-weight: 600; }
  td.wr-low { color: var(--wr-low); font-weight: 600; }
  td.result-win { color: var(--ok); font-weight: 600; }
  td.result-loss { color: var(--err); font-weight: 600; }
  td.result-draw { color: var(--muted); }
  #gate {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }
  #gate a {
    color: var(--accent);
    text-decoration: none;
    font-size: 16px;
  }
  #gate a:hover { text-decoration: underline; }
  #loading { text-align: center; padding: 60px; color: var(--muted); }
  .history-scroll { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>asobby 戦績</h1>
  <span class="sub">非想天則 対戦記録</span>
  <nav>
    <a href="/">ロビー</a>
    <a href="/replays">リプレイ検索</a>
  </nav>
</header>

<main>
  <div id="loading">読み込み中...</div>
  <div id="gate" hidden>
    <p>戦績を見るには Discord ログインが必要です</p>
    <p><a href="/auth/discord/web">Discord でログイン</a></p>
  </div>
  <div id="content" hidden>
    <div class="panel" id="overview"></div>
    <div class="panel" id="ranked-panel">
      <h2>ランクマ</h2>
      <div id="ranked-summary"></div>
    </div>
    <div class="panel" id="filter-panel">
      <h2>絞り込み</h2>
      <div class="filter-bar" id="filter-bar"></div>
    </div>
    <div class="panel" id="summary-panel">
      <div class="summary-row" id="summary-row"></div>
    </div>
    <div class="facets" id="facets">
      <div class="facet">
        <h2>自キャラ別</h2>
        <div class="facet-scroll">
          <table>
            <thead><tr><th>キャラ</th><th>対戦</th><th>勝</th><th>負</th><th>勝率</th></tr></thead>
            <tbody id="facet-my-char"></tbody>
          </table>
        </div>
      </div>
      <div class="facet">
        <h2>相手キャラ別</h2>
        <div class="facet-scroll">
          <table>
            <thead><tr><th>キャラ</th><th>対戦</th><th>勝</th><th>負</th><th>勝率</th></tr></thead>
            <tbody id="facet-opp-char"></tbody>
          </table>
        </div>
      </div>
      <div class="facet">
        <h2>相手プロファイル別</h2>
        <div class="facet-scroll">
          <table>
            <thead><tr><th>プロファイル</th><th>対戦</th><th>勝</th><th>負</th><th>勝率</th></tr></thead>
            <tbody id="facet-opp-profile"></tbody>
          </table>
        </div>
        <button type="button" class="btn-more" id="profile-more" hidden>もっと見る</button>
      </div>
    </div>
    <div class="panel" id="history-panel">
      <h2>対戦履歴</h2>
      <div class="history-scroll">
        <table>
          <thead><tr>
            <th>日時</th><th>自キャラ</th><th>相手キャラ</th><th>相手プロファイル</th>
            <th>勝敗</th><th>ランクマ</th><th>リプレイ</th>
          </tr></thead>
          <tbody id="history-rows"></tbody>
        </table>
      </div>
    </div>
    <div class="panel" id="import-panel">
      <h2>天則観インポート</h2>
      <p style="color:var(--muted);font-size:14px;margin:0 0 12px;line-height:1.5">
        天則観 (tsk) の戦績DB (.db) をアップロードすると過去の対戦が取り込まれます。
        同じファイルを再アップロードしても重複しません。
      </p>
      <input type="file" id="tsk-file" accept=".db,application/x-sqlite3,application/octet-stream">
      <button id="tsk-upload" style="margin-left:8px;padding:6px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px">アップロード</button>
      <div id="tsk-result" style="margin-top:12px;font-size:14px"></div>
    </div>
  </div>
</main>

<script>
const CHAR_NAME = {
  0: "Reimu", 1: "Marisa", 2: "Sakuya", 3: "Alice", 4: "Patchouli",
  5: "Youmu", 6: "Remilia", 7: "Yuyuko", 8: "Yukari", 9: "Suica",
  10: "Reisen", 11: "Aya", 12: "Komachi", 13: "Iku", 14: "Tenshi",
  15: "Sanae", 16: "Cirno", 17: "Meiling", 18: "Utsuho", 19: "Suwako",
  20: "Random",
};

const RANK_LABEL = {
  easy: "E", normal: "N", ex: "Ex", hard: "H", luna: "L", ph: "Ph",
};

const MATCH_LIMIT = 5000;
const PROFILE_TOP = 30;
const HISTORY_LIMIT = 100;
const CACHE_VERSION = 1;

let allMatches = [];
let statsData = null;
let profileShowAll = false;
let lastKnownTotal = null;

const filter = {
  myChar: null,
  oppChar: null,
  oppProfile: null,
  rankedOnly: false,
};

function charName(id) {
  return CHAR_NAME[id] || `CHAR_${id}`;
}

function pct(rate) {
  return (rate * 100).toFixed(1) + "%";
}

function myChar(m) {
  return m.my_side === "host" ? m.host_char : m.guest_char;
}

function oppChar(m) {
  return m.my_side === "host" ? m.guest_char : m.host_char;
}

function oppProfile(m) {
  return m.my_side === "host" ? (m.guest_profile || "") : (m.host_profile || "");
}

function matchWon(m) {
  return (m.my_side === "host" && m.winner === "host")
    || (m.my_side === "guest" && m.winner === "guest");
}

function matchLost(m) {
  return m.winner !== "draw" && !matchWon(m);
}

function winRateClass(rate) {
  if (rate >= 0.6) return "wr-high";
  if (rate <= 0.4) return "wr-low";
  return "";
}

function computeBucket(matches) {
  let wins = 0;
  let losses = 0;
  let draws = 0;
  for (const m of matches) {
    if (m.winner === "draw") draws++;
    else if (matchWon(m)) wins++;
    else losses++;
  }
  const decisive = wins + losses;
  return {
    games: matches.length,
    wins,
    losses,
    draws,
    winRate: decisive > 0 ? wins / decisive : 0,
  };
}

function applyFilter(matches, excludeDim) {
  return matches.filter((m) => {
    if (filter.rankedOnly && !m.ranked) return false;
    if (excludeDim !== "myChar" && filter.myChar !== null && myChar(m) !== filter.myChar) return false;
    if (excludeDim !== "oppChar" && filter.oppChar !== null && oppChar(m) !== filter.oppChar) return false;
    if (excludeDim !== "oppProfile" && filter.oppProfile !== null && oppProfile(m) !== filter.oppProfile) return false;
    return true;
  });
}

function groupByChar(matches, pickChar) {
  const map = new Map();
  for (const m of matches) {
    const cid = pickChar(m);
    let row = map.get(cid);
    if (!row) {
      row = { char: cid, wins: 0, losses: 0, draws: 0, games: 0 };
      map.set(cid, row);
    }
    row.games++;
    if (m.winner === "draw") row.draws++;
    else if (matchWon(m)) row.wins++;
    else row.losses++;
  }
  const rows = [];
  for (const row of map.values()) {
    const decisive = row.wins + row.losses;
    rows.push({
      ...row,
      winRate: decisive > 0 ? row.wins / decisive : 0,
    });
  }
  rows.sort((a, b) => b.games - a.games || a.char - b.char);
  return rows;
}

function groupByProfile(matches) {
  const map = new Map();
  for (const m of matches) {
    const prof = oppProfile(m) || "(なし)";
    let row = map.get(prof);
    if (!row) {
      row = { profile: prof, wins: 0, losses: 0, draws: 0, games: 0 };
      map.set(prof, row);
    }
    row.games++;
    if (m.winner === "draw") row.draws++;
    else if (matchWon(m)) row.wins++;
    else row.losses++;
  }
  const rows = [];
  for (const row of map.values()) {
    const decisive = row.wins + row.losses;
    rows.push({
      ...row,
      winRate: decisive > 0 ? row.wins / decisive : 0,
    });
  }
  rows.sort((a, b) => b.games - a.games || a.profile.localeCompare(b.profile, "ja"));
  return rows;
}

function recentWinRates(matches, counts) {
  const sorted = matches.slice().sort((a, b) => b.played_at - a.played_at);
  const out = {};
  for (const n of counts) {
    const subset = sorted.slice(0, n);
    const bucket = computeBucket(subset);
    out[n] = {
      games: bucket.games,
      wins: bucket.wins,
      winRate: bucket.winRate,
    };
  }
  return out;
}

function formatJst(unixSec) {
  const d = new Date(unixSec * 1000);
  return d.toLocaleString("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false,
  });
}

function resultSymbol(m) {
  if (m.winner === "draw") return { text: "△", cls: "result-draw" };
  return matchWon(m)
    ? { text: "○", cls: "result-win" }
    : { text: "×", cls: "result-loss" };
}

function appendTextCell(tr, text, cls) {
  const td = document.createElement("td");
  td.textContent = text;
  if (cls) td.className = cls;
  tr.appendChild(td);
}

function appendWinRateCell(tr, rate, decisive) {
  const td = document.createElement("td");
  td.textContent = decisive > 0 ? pct(rate) : "-";
  if (decisive > 0) {
    const cls = winRateClass(rate);
    if (cls) td.className = cls;
  }
  tr.appendChild(td);
}

function fillFacetCharTable(tbody, rows, dim, selected) {
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = "facet-row";
    if (selected === r.char) tr.classList.add("selected");
    tr.dataset.dim = dim;
    tr.dataset.value = String(r.char);
    appendTextCell(tr, charName(r.char));
    appendTextCell(tr, String(r.games));
    appendTextCell(tr, String(r.wins));
    appendTextCell(tr, String(r.losses));
    appendWinRateCell(tr, r.winRate, r.wins + r.losses);
    frag.appendChild(tr);
  }
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.style.color = "var(--muted)";
    td.textContent = "データなし";
    tr.appendChild(td);
    frag.appendChild(tr);
  }
  tbody.replaceChildren(frag);
}

function fillFacetProfileTable(tbody, rows, selected) {
  const frag = document.createDocumentFragment();
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = "facet-row";
    const value = r.profile === "(なし)" ? "" : r.profile;
    if (selected === value) tr.classList.add("selected");
    tr.dataset.dim = "oppProfile";
    tr.dataset.value = value;
    appendTextCell(tr, r.profile);
    appendTextCell(tr, String(r.games));
    appendTextCell(tr, String(r.wins));
    appendTextCell(tr, String(r.losses));
    appendWinRateCell(tr, r.winRate, r.wins + r.losses);
    frag.appendChild(tr);
  }
  if (!rows.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 5;
    td.style.color = "var(--muted)";
    td.textContent = "データなし";
    tr.appendChild(td);
    frag.appendChild(tr);
  }
  tbody.replaceChildren(frag);
}

function renderFilterBar() {
  const bar = document.getElementById("filter-bar");
  bar.textContent = "";

  const chips = [];
  if (filter.myChar !== null) {
    chips.push({ key: "myChar", label: `自キャラ: ${charName(filter.myChar)}` });
  }
  if (filter.oppChar !== null) {
    chips.push({ key: "oppChar", label: `相手: ${charName(filter.oppChar)}` });
  }
  if (filter.oppProfile !== null) {
    const prof = filter.oppProfile || "(なし)";
    chips.push({ key: "oppProfile", label: `相手プロファイル: ${prof}` });
  }

  for (const chip of chips) {
    const span = document.createElement("span");
    span.className = "filter-chip";
    const label = document.createElement("span");
    label.textContent = chip.label;
    span.appendChild(label);
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = "×";
    btn.title = "解除";
    btn.addEventListener("click", () => {
      filter[chip.key] = null;
      if (chip.key === "oppProfile") profileShowAll = false;
      renderAll();
    });
    span.appendChild(btn);
    bar.appendChild(span);
  }

  if (!chips.length) {
    const hint = document.createElement("span");
    hint.style.color = "var(--muted)";
    hint.style.fontSize = "13px";
    hint.textContent = "ファセットをクリックして絞り込み";
    bar.appendChild(hint);
  }

  const actions = document.createElement("div");
  actions.className = "filter-actions";

  const rankedLabel = document.createElement("label");
  const rankedCb = document.createElement("input");
  rankedCb.type = "checkbox";
  rankedCb.checked = filter.rankedOnly;
  rankedCb.addEventListener("change", () => {
    filter.rankedOnly = rankedCb.checked;
    profileShowAll = false;
    renderAll();
  });
  rankedLabel.appendChild(rankedCb);
  rankedLabel.appendChild(document.createTextNode("ランクマのみ"));
  actions.appendChild(rankedLabel);

  const clearBtn = document.createElement("button");
  clearBtn.type = "button";
  clearBtn.className = "btn-clear";
  clearBtn.textContent = "すべてクリア";
  clearBtn.addEventListener("click", () => {
    filter.myChar = null;
    filter.oppChar = null;
    filter.oppProfile = null;
    filter.rankedOnly = false;
    profileShowAll = false;
    renderAll();
  });
  actions.appendChild(clearBtn);

  bar.appendChild(actions);
}

function renderSummary() {
  const filtered = applyFilter(allMatches, null);
  const bucket = computeBucket(filtered);
  const recent = recentWinRates(filtered, [30, 50, 100]);
  const el = document.getElementById("summary-row");
  el.textContent = "";

  const main = document.createElement("div");
  main.className = "summary-main";
  const decisive = bucket.wins + bucket.losses;
  const rateText = decisive > 0 ? pct(bucket.winRate) : "-";
  main.textContent =
    `${bucket.games} 戦 ${bucket.wins} 勝 ${bucket.losses} 敗 勝率 ${rateText} (引分 ${bucket.draws})`;
  el.appendChild(main);

  const recentEl = document.createElement("div");
  recentEl.className = "summary-recent";
  for (const n of [30, 50, 100]) {
    const r = recent[n];
    const span = document.createElement("span");
    const strong = document.createElement("strong");
    strong.textContent = r.games > 0 ? pct(r.winRate) : "-";
    span.appendChild(document.createTextNode(`直近${n}: `));
    span.appendChild(strong);
    if (r.games < n) {
      span.appendChild(document.createTextNode(` (${r.games}戦)`));
    }
    recentEl.appendChild(span);
  }
  el.appendChild(recentEl);
}

function renderFacets() {
  const myRows = groupByChar(applyFilter(allMatches, "myChar"), myChar);
  const oppRows = groupByChar(applyFilter(allMatches, "oppChar"), oppChar);
  const profRows = groupByProfile(applyFilter(allMatches, "oppProfile"));

  fillFacetCharTable(
    document.getElementById("facet-my-char"),
    myRows,
    "myChar",
    filter.myChar,
  );
  fillFacetCharTable(
    document.getElementById("facet-opp-char"),
    oppRows,
    "oppChar",
    filter.oppChar,
  );

  const showAll = profileShowAll;
  const visibleProf = showAll ? profRows : profRows.slice(0, PROFILE_TOP);
  fillFacetProfileTable(
    document.getElementById("facet-opp-profile"),
    visibleProf,
    filter.oppProfile,
  );

  const moreBtn = document.getElementById("profile-more");
  moreBtn.hidden = profRows.length <= PROFILE_TOP || showAll;
}

function renderHistory() {
  const tbody = document.getElementById("history-rows");
  const filtered = applyFilter(allMatches, null)
    .slice()
    .sort((a, b) => b.played_at - a.played_at)
    .slice(0, HISTORY_LIMIT);

  const frag = document.createDocumentFragment();
  for (const m of filtered) {
    const tr = document.createElement("tr");
    appendTextCell(tr, formatJst(m.played_at));
    appendTextCell(tr, charName(myChar(m)));
    appendTextCell(tr, charName(oppChar(m)));
    appendTextCell(tr, oppProfile(m) || "(なし)");

    const res = resultSymbol(m);
    appendTextCell(tr, res.text, res.cls);

    appendTextCell(tr, m.ranked ? "o" : "x");

    const tdReplay = document.createElement("td");
    if (m.has_replay) {
      const a = document.createElement("a");
      a.href = `/replays/${m.id}`;
      a.textContent = "DL";
      tdReplay.appendChild(a);
    } else {
      tdReplay.textContent = "-";
    }
    tr.appendChild(tdReplay);

    frag.appendChild(tr);
  }
  if (!filtered.length) {
    const tr = document.createElement("tr");
    const td = document.createElement("td");
    td.colSpan = 7;
    td.style.color = "var(--muted)";
    td.textContent = "データなし";
    tr.appendChild(td);
    frag.appendChild(tr);
  }
  tbody.replaceChildren(frag);
}

function renderOverview() {
  const ov = document.getElementById("overview");
  ov.textContent = "";
  const user = statsData.user;
  const row = document.createElement("div");
  row.className = "user-row";
  if (user.avatar) {
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = user.avatar;
    img.alt = "";
    img.referrerPolicy = "no-referrer";
    row.appendChild(img);
  }
  const name = document.createElement("span");
  name.className = "user-name";
  name.textContent = user.name;
  row.appendChild(name);
  ov.appendChild(row);

  const count = document.createElement("div");
  count.className = "summary";
  count.style.color = "var(--muted)";
  count.style.fontSize = "14px";
  count.textContent = `全 ${allMatches.length} 戦`;
  ov.appendChild(count);
}

function renderRanked() {
  const ranked = statsData.ranked || {};
  const rankedEl = document.getElementById("ranked-summary");
  rankedEl.textContent = "";

  const rRank = (ranked.rank || "easy").toLowerCase();
  let rankText = RANK_LABEL[rRank] || ranked.rank || "";
  if (rRank === "ph" && ranked.rating != null) {
    rankText += ` (${ranked.rating})`;
  }
  const rankLine = document.createElement("div");
  rankLine.className = "summary";
  rankLine.style.marginBottom = "10px";
  rankLine.textContent = `現在ランク: ${rankText}`;
  rankedEl.appendChild(rankLine);

  const rt = ranked.total || { games: 0, wins: 0, losses: 0, draws: 0, win_rate: 0 };
  const rTotal = document.createElement("div");
  rTotal.className = "summary";
  rTotal.style.marginBottom = "8px";
  rTotal.innerHTML =
    `ランクマ総合成績: <strong>${rt.wins}-${rt.losses}-${rt.draws}</strong>　勝率: <span class="win-rate">${pct(rt.win_rate)}</span>（${rt.games} 戦）`;
  rankedEl.appendChild(rTotal);

  const r50 = ranked.recent50 || { games: 0, wins: 0, win_rate: 0 };
  const rRecent = document.createElement("div");
  rRecent.className = "summary";
  rRecent.innerHTML =
    `直近 50 戦: <span class="win-rate">${pct(r50.win_rate)}</span>（${r50.wins}勝 / ${r50.games}戦）`;
  rankedEl.appendChild(rRecent);
}

function renderAll() {
  renderFilterBar();
  renderSummary();
  renderFacets();
  renderHistory();
}

function onFacetClick(dim, rawValue) {
  let value;
  if (dim === "myChar" || dim === "oppChar") {
    value = Number(rawValue);
  } else {
    value = rawValue;
  }

  if (filter[dim] === value) {
    filter[dim] = null;
  } else {
    filter[dim] = value;
  }
  if (dim === "oppProfile") profileShowAll = false;
  renderAll();
}

function setupFacetDelegation() {
  const facets = document.getElementById("facets");
  if (facets.dataset.bound) return;
  facets.dataset.bound = "1";
  facets.addEventListener("click", (ev) => {
    const tr = ev.target.closest("tr.facet-row");
    if (!tr) return;
    onFacetClick(tr.dataset.dim, tr.dataset.value);
  });
}

function setupProfileMore() {
  const btn = document.getElementById("profile-more");
  if (btn.dataset.bound) return;
  btn.dataset.bound = "1";
  btn.addEventListener("click", () => {
    profileShowAll = true;
    renderFacets();
  });
}

function cacheKey() {
  return `asobby_matches_v${CACHE_VERSION}_${statsData.user.id}`;
}

function readCache() {
  try {
    const raw = localStorage.getItem(cacheKey());
    if (!raw) return null;
    const data = JSON.parse(raw);
    return Array.isArray(data) ? data : null;
  } catch (_) {
    return null;
  }
}

function writeCache(rows) {
  try {
    localStorage.setItem(cacheKey(), JSON.stringify(rows));
  } catch (_) {
    // 容量超過等。キャッシュなしでも動作に支障はない
    try { localStorage.removeItem(cacheKey()); } catch (_) {}
  }
}

async function fetchMatchesSince(since) {
  const out = [];
  while (true) {
    const res = await fetch(
      `/stats/me/matches?since=${since}&limit=${MATCH_LIMIT}`,
      { credentials: "same-origin" },
    );
    if (!res.ok) throw new Error("matches fetch failed");
    const data = await res.json();
    if (typeof data.total === "number") lastKnownTotal = data.total;
    const batch = data.matches || [];
    if (!batch.length) break;
    for (const m of batch) {
      out.push(m);
      if (m.played_at > since) since = m.played_at;
    }
    if (batch.length < MATCH_LIMIT) break;
  }
  return out;
}

async function loadAllMatches(forceFull) {
  const cached = forceFull ? null : readCache();
  const map = new Map();
  let since = 0;
  if (cached) {
    for (const m of cached) {
      map.set(m.id, m);
      if (m.played_at > since) since = m.played_at;
    }
  }
  const fresh = await fetchMatchesSince(since);
  for (const m of fresh) map.set(m.id, m);
  const rows = Array.from(map.values());
  // サーバー総数と食い違う場合 (過去日時のインポートや同期でキャッシュに穴) は全再取得
  if (!forceFull && lastKnownTotal !== null && rows.length !== lastKnownTotal) {
    return loadAllMatches(true);
  }
  writeCache(rows);
  return rows;
}

async function reloadData(forceFull) {
  allMatches = await loadAllMatches(forceFull);
  const statsRes = await fetch("/stats/me", { credentials: "same-origin" });
  if (!statsRes.ok) throw new Error("stats fetch failed");
  statsData = await statsRes.json();
  renderOverview();
  renderRanked();
  renderAll();
}

function setupTskImport() {
  const btn = document.getElementById("tsk-upload");
  const fileInput = document.getElementById("tsk-file");
  const resultEl = document.getElementById("tsk-result");
  if (!btn || btn.dataset.bound) return;
  btn.dataset.bound = "1";

  btn.addEventListener("click", async () => {
    const file = fileInput.files[0];
    resultEl.textContent = "";
    if (!file) {
      resultEl.style.color = "var(--err)";
      resultEl.textContent = "ファイルを選択してください";
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch("/import/tensokukan", {
        method: "POST",
        body: file,
        credentials: "same-origin",
      });
      if (!res.ok) {
        resultEl.style.color = "var(--err)";
        let detail = "";
        try {
          const err = await res.json();
          detail = err.detail || JSON.stringify(err);
        } catch (_) {
          detail = res.statusText;
        }
        resultEl.textContent = `エラー (${res.status}): ${detail}`;
        return;
      }
      const data = await res.json();
      resultEl.style.color = "var(--ok)";
      resultEl.textContent =
        `取り込み: ${data.imported} 件 / 重複スキップ: ${data.skipped_duplicate} 件 / 不正スキップ: ${data.skipped_invalid} 件（全 ${data.total} 行）`;
      if (data.imported > 0) {
        filter.myChar = null;
        filter.oppChar = null;
        filter.oppProfile = null;
        filter.rankedOnly = false;
        profileShowAll = false;
        await reloadData(true);
      }
    } catch (_) {
      resultEl.style.color = "var(--err)";
      resultEl.textContent = "アップロードに失敗しました";
    } finally {
      btn.disabled = false;
    }
  });
}

async function init() {
  const loading = document.getElementById("loading");
  const gate = document.getElementById("gate");
  const content = document.getElementById("content");
  try {
    const probe = await fetch("/stats/me", { credentials: "same-origin" });
    if (probe.status === 401) {
      loading.hidden = true;
      gate.hidden = false;
      return;
    }
    if (!probe.ok) {
      loading.textContent = "読み込みに失敗しました";
      return;
    }
    statsData = await probe.json();
    loading.textContent = "対戦データを読み込み中...";
    allMatches = await loadAllMatches();
    loading.hidden = true;
    content.hidden = false;
    renderOverview();
    renderRanked();
    setupFacetDelegation();
    setupProfileMore();
    renderAll();
    setupTskImport();
  } catch (_) {
    loading.textContent = "読み込みに失敗しました";
  }
}

init();
</script>
