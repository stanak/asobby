# fly.toml app configuration file generated for asobby on 2026-07-12T14:01:47+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'asobby'
primary_region = 'nrt'

[build]
  dockerfile = 'Dockerfile'

[env]
  # fly.io は任意ポートへの外向き UDP を遮断するが、UDP サービスとして
  # 公開したポートを送信元にすれば専用 IPv4 経由で返信が戻る。
  # プローブの送信元を fly-global-services:10800 に固定して検証を有効化する。
  # (専用 IPv4 の割り当てが必要: fly ips allocate-v4)
  ASOBBY_PROBE_BIND_HOST = 'fly-global-services'
  ASOBBY_PROBE_BIND_PORT = '10800'
  ASOBBY_STORE_DIR = '/data/asobby'
  # 到達性 UDP プローブは誤検知が多いため無効 (autopunch はクライアント申告を表示)
  ASOBBY_HOSTCHECK = 'off'

[mounts]
  source = 'asobby_store'
  destination = '/data'

# ホスト到達性プローブ用の UDP サービス (送信元ポートの NAT 経路を確保する)
[[services]]
  protocol = 'udp'
  internal_port = 10800

  [[services.ports]]
    port = 10800

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

[[vm]]
  # fly.io 上の専用 CPU (旧称 dedicated)。shared-cpu-* ではなく performance-* を使う。
  size = 'performance-1x'
  memory = '2gb'
  cpus = 1
  memory_mb = 2048
